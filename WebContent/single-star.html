<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        .colored-title {
            color: #0c68c9; /* Blue color */
        }
    </style>

    <title>Single Star</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="browse.html">Browse</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="cart.html">Checkout</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="text-center mb-4 colored-title">Star Info</h1>

    <table id=single_star_body class="table table-striped">
        <!-- Create a table header -->
        <thead class="thead-dark">
        <tr>
            <!-- Titles of each column-->
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Featured In...</th>
        </tr>
        </thead>
        <!-- Table body is left empty here, will be populated with the data retrieved with single-star.js -->
        <!-- Again, id "star_info" is useful for jQuery to find this html element -->
        <tbody id=star_info></tbody>
    </table>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to single-star.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
    otherwise the url is relative to the root path-->
<script src="single-star.js"></script>
</body>

</html>
