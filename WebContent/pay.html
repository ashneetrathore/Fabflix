<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        /* CSS for the colored title */
        .colored-title {
            color: #0c68c9; /* Blue color */
        }
    </style>

    <title>Payment Form</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="browse.html">Browse</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="cart.html">Checkout</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="text-center colored-title">Payment Form</h1>

    <div id="cart_summary" class="my-4">
        <span id="total_price" class="font-weight-bold"></span>
    </div>

    <form id="pay_form" method="post" action="#">
        <div class="form-group">
            <label for="firstName"><b>First Name</b></label>
            <input id="firstName" name="firstName" class="form-control" placeholder="Enter first name" type="text">
        </div>
        <div class="form-group">
            <label for="lastName"><b>Last Name</b></label>
            <input id="lastName" name="lastName" class="form-control" placeholder="Enter last name" type="text">
        </div>
        <div class="form-group">
            <label for="ccNum"><b>Credit Card Number</b></label>
            <input id="ccNum" name="ccNum" class="form-control" placeholder="Enter credit card number" type="text">
        </div>
        <div class="form-group">
            <label for="expDate"><b>Credit Card Expiration Date</b></label>
            <input id="expDate" name="expDate" class="form-control" placeholder="Enter credit card expiration date" type="text">
        </div>
        <button type="submit" class="btn btn-primary">Place Order</button>
    </form>
    <div id="payment_error_message" class="mt-3"></div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- Include your own JS file -->
<script src="pay.js"></script>
</body>
</html>
