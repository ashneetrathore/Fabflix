<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        .colored-title {
            color: #0c68c9; /* Blue color */
        }

    </style>

    <title>Results</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="browse.html">Browse</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="cart.html">Checkout</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="text-center mb-4 colored-title">Results</h1>
    <!-- Add Order By dropdown -->
    <div class="form-group">
        <label for="order_by">Order By:</label>
        <select class="form-control" id="order_by" name="order_by">
            <option value="none"></option>
            <option value="tArA">Title Ascending, Rating Ascending</option>
            <option value="tDrD">Title Descending, Rating Descending</option>
            <option value="tArD">Title Ascending, Rating Descending</option>
            <option value="tDrA">Title Descending, Rating Ascending</option>

            <option value="rAtA">Rating Ascending, Title Ascending</option>
            <option value="rDtD">Rating Descending, Title Descending</option>
            <option value="rAtD">Rating Ascending, Title Descending</option>
            <option value="rDtA">Rating Descending, Title Ascending</option>
        </select>
    </div>

    <!-- Add Movies Per Page dropdown -->
    <div class="form-group">
        <label for="per_page">Movies Per Page:</label>
        <select class="form-control" id="per_page" name="per_page">
            <option value="none"></option>
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
    </div>
    <!-- Id "movie_table" is useful for jQuery to find the html element with id, class here is mapping to Bootstrap defined class CSS -->
    <table id="movie_table" class="table table-striped">
        <!-- Create a table header -->
        <thead class="thead-dark">
        <tr>
            <!-- Titles of each column-->
            <th>Title</th>
            <th>Year</th>
            <th>Director</th>
            <th>Genres</th>
            <th>Stars</th>
            <th>Rating</th>
            <th>Cart</th>
        </tr>
        </thead>
        <!-- Table body is left empty here, will be populated with the data retrieved with index.js -->
        <!-- Again, id "movie_table_body" is useful for jQuery to find this html element -->
        <tbody id="movie_table_body"></tbody>
    </table>

    <div class="button-container text-center mb-4">
        <button id="prevButton" class="btn btn-primary">Previous</button>
        <button id="nextButton" class="btn btn-primary">Next</button>
    </div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to index.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="index.js"></script>
</body>
</html>
