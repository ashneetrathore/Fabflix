<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        .colored-title {
            color: #0c68c9; /* Blue color */
        }
    </style>

    <title>Order Confirmation</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="search.html">Search</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="browse.html">Browse</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="cart.html">Checkout</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="text-center mb-4 colored-title">Order Confirmation</h1>
    <table id="cart_table" class="table table-striped">
        <!-- Create a table header -->
        <thead class="thead-dark">
        <tr>
            <!-- Titles of each column-->
            <th>Sales Id</th>
            <th>Movie Title</th>
            <th>Quantity</th>
        </tr>
        </thead>
        <!-- Table body is left empty here, will be populated with the data retrieved with index.js -->
        <!-- Again, id "movie_table_body" is useful for jQuery to find this html element -->
        <tbody id="confirmation_table_body"></tbody>
    </table>

    <div id="cart_summary" class="my-4">
        <span id="total_price" class="font-weight-bold"></span>
    </div>

</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to index.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="confirm.js"></script>
</body>
</html>
