<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        /* CSS for the colored title */
        .colored-title {
            color: #0c68c9; /* Blue color */
        }
    </style>

    <title>Add a Movie</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="metadata.html">Metadata</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="addstar.html">Add a Star</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="addmovie.html">Add a Movie</a>
        </li>
    </ul>
</nav>

<div class="container mt-4">
    <h1 class="text-center colored-title">Add a Movie</h1>
    <form id="addmovie_form" method="post" action="#">
        <div class="form-group">
            <label for="title"><b>Title</b></label>
            <input id="title" name="title" class="form-control" placeholder="Enter movie title (required)" type="text">
        </div>
        <div class="form-group">
            <label for="year"><b>Release Year</b></label>
            <input id="year" name="year" class="form-control" placeholder="Enter release year (required)" type="text">
        </div>
        <div class="form-group">
            <label for="director"><b>Director</b></label>
            <input id="director" name="director" class="form-control" placeholder="Enter director name (required)" type="text">
        </div>
        <div class="form-group">
            <label for="sname"><b>Star Name</b></label>
            <input id="sname" name="sname" class="form-control" placeholder="Enter star name (required)" type="text">
        </div>
        <div class="form-group">
            <label for="birthYear"><b>Star Birth Year</b></label>
            <input id="birthYear" name="birthYear" class="form-control" placeholder="Enter star birth year (optional)" type="text">
        </div>
        <div class="form-group">
            <label for="genre"><b>Genre</b></label>
            <input id="genre" name="genre" class="form-control" placeholder="Enter genre name (required)" type="text">
        </div>

        <button type="submit" class="btn btn-primary">Add</button>
    </form>
    <div id="addmovie_message" class="mt-3"></div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- Include your own JS file -->
<script src="addmovie.js"></script>
</body>
</html>
