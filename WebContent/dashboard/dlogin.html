<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        /* CSS for the colored title */
        .colored-title {
            color: #0c68c9; /* Blue color */
        }
    </style>

    <title>Fabflix Employee Login</title>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center colored-title">Fabflix Employee Login</h1>
    <form id="employee_login_form" method="post" action="#">
        <div class="form-group">
            <label for="email"><b>Email</b></label>
            <input id="email" name="email" class="form-control" placeholder="Enter Email" type="text">
        </div>

        <div class="form-group">
            <label for="password"><b>Password</b></label>
            <input id="password" name="password" class="form-control" placeholder="Enter Password" type="password">
        </div>

        <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6Le4jdMpAAAAAITA_4f28p7Nq4JEvikS-6UauFMY"></div>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div id="employee_login_error_message" class="mt-3"></div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- Include your own JS file -->
<script src="dlogin.js"></script>
</body>
</html>
